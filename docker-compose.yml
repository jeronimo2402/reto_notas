services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas
      POSTGRES_DB: notas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas -d notas"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Node corre en contenedor: no hace falta instalar Node en el equipo.
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://notas:notas@db:5432/notas
    ports:
      - "4321:4321"
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

volumes:
  pgdata:
